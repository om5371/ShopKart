<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — ShopKart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Shop<span class="dot">Kart</span></a>
    <div class="header-actions" style="margin-left:auto;">
      <a id="accountLink" href="login.html"><i class="fa-solid fa-user"></i><span id="accountLabel">Login</span></a>
      <a href="cart.html" style="position:relative;"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span><span class="cart-badge" style="display:none;">0</span></a>
      <a href="#" onclick="logoutUser();window.location.href='index.html';"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </div>
  </div>
</header>

<div class="container section">
  <h2 style="margin-bottom:4px;">My Account</h2>
  <p style="color:var(--muted);margin-bottom:26px;">Manage your profile and view your order history</p>

  <div class="checkout-card" id="profileCard"></div>

  <h3 style="margin:30px 0 16px;">Order History</h3>
  <div id="ordersWrap"></div>
</div>

<footer style="margin-top:20px;">
  <div class="footer-bottom">© 2026 ShopKart. All prices are shown in Indian Rupees (₹). Demo project for educational purposes.</div>
</footer>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script>
requireLogin("login.html");
const user = getCurrentUser();

document.getElementById("profileCard").innerHTML = `
  <h3><i class="fa-solid fa-id-card"></i> Profile Details</h3>
  <div class="form-row" style="margin-top:14px;">
    <div><strong>Name:</strong><br>${user.name}</div>
    <div><strong>Username:</strong><br>${user.username}</div>
  </div>
  <div class="form-row mt-24">
    <div><strong>Email:</strong><br>${user.email}</div>
    <div><strong>Phone:</strong><br>${user.phone}</div>
  </div>
  <div class="mt-24"><strong>Address:</strong><br>${user.address}</div>
`;

const orders = getOrdersForUser(user.username);
const wrap = document.getElementById("ordersWrap");
if (!orders.length) {
  wrap.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box"></i><h3>No orders yet</h3><p>Your placed orders will show up here.</p><a href="category.html" class="btn btn-primary">Start Shopping</a></div>`;
} else {
  wrap.innerHTML = orders.map(o => `
    <div class="checkout-card">
      <div class="flex-between">
        <div>
          <strong>${o.id}</strong> &nbsp; <span class="badge ${o.status.toLowerCase()}">${o.status}</span>
          <div style="font-size:12.5px;color:var(--muted);margin-top:4px;">Placed on ${new Date(o.placedAt).toLocaleString("en-IN")}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:var(--font-display);font-weight:700;font-size:17px;">${formatINR(o.total)}</div>
          <div style="font-size:12px;color:var(--muted);">via ${o.payment.method.toUpperCase()}</div>
        </div>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:14px 0;">
      ${o.items.map(i => `
        <div class="order-summary-mini row">
          <div class="left"><img src="${i.image}" alt="${i.name}"><span>${i.name} × ${i.qty}</span></div>
          <span>${formatINR(i.price * i.qty)}</span>
        </div>`).join("")}
      <div style="font-size:12.5px;color:var(--muted);margin-top:10px;"><i class="fa-solid fa-location-dot"></i> Shipping to: ${o.shipping.address}, ${o.shipping.city}, ${o.shipping.state} - ${o.shipping.pincode}</div>
    </div>`).join("");
}
</script>
</body>
</html>
