<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart — ShopKart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Shop<span class="dot">Kart</span></a>
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Search for products, brands and more">
      <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>
    <div class="header-actions">
      <a id="accountLink" href="login.html"><i class="fa-solid fa-user"></i><span id="accountLabel">Login</span></a>
      <a href="cart.html" style="position:relative;">
        <i class="fa-solid fa-cart-shopping"></i><span>Cart</span>
        <span class="cart-badge" style="display:none;">0</span>
      </a>
    </div>
  </div>
</header>
<nav class="category-nav"><div class="container" id="categoryNav"></div></nav>

<div class="container">
  <div class="breadcrumb"><a href="index.html">Home</a> / <span>Shopping Cart</span></div>
</div>

<div class="container section" style="padding-top:8px;">
  <h2 style="margin-bottom:22px;">Your Shopping Cart</h2>
  <div id="cartContent"></div>
</div>

<footer style="margin-top:20px;">
  <div class="footer-bottom">© 2026 ShopKart. All prices are shown in Indian Rupees (₹). Demo project for educational purposes.</div>
</footer>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById("categoryNav").innerHTML = CATEGORIES.map(c => `<a href="category.html?cat=${c.id}">${c.name}</a>`).join("");

function renderCart() {
  const items = cartWithDetails();
  const wrap = document.getElementById("cartContent");
  if (!items.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-cart-shopping"></i>
        <h3>Your cart is empty</h3>
        <p>Looks like you haven't added anything yet.</p>
        <a href="category.html" class="btn btn-primary">Start Shopping</a>
      </div>`;
    return;
  }
  const rows = items.map(i => `
    <tr>
      <td>
        <div class="cart-item-info">
          <img src="${i.product.image}" alt="${i.product.name}">
          <div>
            <div class="name">${i.product.name}</div>
            <span class="product-cat">${i.product.subcategory}</span><br>
            <a class="remove-link" onclick="removeFromCart('${i.productId}');renderCart();"><i class="fa-solid fa-trash"></i> Remove</a>
          </div>
        </div>
      </td>
      <td>${formatINR(i.product.price)}</td>
      <td>
        <div class="qty-selector">
          <button onclick="updateCartQty('${i.productId}', ${i.qty - 1}); renderCart();">−</button>
          <input type="number" value="${i.qty}" min="1" onchange="updateCartQty('${i.productId}', parseInt(this.value)||1); renderCart();">
          <button onclick="updateCartQty('${i.productId}', ${i.qty + 1}); renderCart();">+</button>
        </div>
      </td>
      <td><strong>${formatINR(i.product.price * i.qty)}</strong></td>
    </tr>`).join("");

  const subtotal = cartTotal();
  const shipping = subtotal >= 999 || subtotal === 0 ? 0 : 79;
  const tax = Math.round(subtotal * 0.05);
  const grandTotal = subtotal + shipping + tax;

  wrap.innerHTML = `
    <div class="cart-layout">
      <table class="cart-table">
        <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span>${formatINR(subtotal)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? "FREE" : formatINR(shipping)}</span></div>
        <div class="summary-row"><span>Estimated Tax (5%)</span><span>${formatINR(tax)}</span></div>
        <div class="summary-row total"><span>Total</span><span>${formatINR(grandTotal)}</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block mt-24"><i class="fa-solid fa-lock"></i> Proceed to Checkout</a>
        <a href="category.html" class="btn btn-outline btn-block mt-24" style="border-color:var(--navy);color:var(--navy);">Continue Shopping</a>
      </div>
    </div>`;
}
renderCart();
</script>
</body>
</html>
