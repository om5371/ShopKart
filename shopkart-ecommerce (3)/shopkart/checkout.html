<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — ShopKart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Shop<span class="dot">Kart</span></a>
    <div class="header-actions" style="margin-left:auto;">
      <a id="accountLink" href="login.html"><i class="fa-solid fa-user"></i><span id="accountLabel">Login</span></a>
      <a href="cart.html" style="position:relative;">
        <i class="fa-solid fa-cart-shopping"></i><span>Cart</span>
        <span class="cart-badge" style="display:none;">0</span>
      </a>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span></div>
</div>

<div class="container section" style="padding-top:8px;" id="checkoutWrap">
  <h2 style="margin-bottom:22px;">Checkout</h2>
  <div id="checkoutBody"></div>
</div>

<footer style="margin-top:20px;">
  <div class="footer-bottom">© 2026 ShopKart. All prices are shown in Indian Rupees (₹). Demo project for educational purposes.</div>
</footer>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script>
requireLogin("login.html");

const items = cartWithDetails();
const body = document.getElementById("checkoutBody");

if (!items.length) {
  body.innerHTML = `<div class="empty-state"><i class="fa-solid fa-cart-shopping"></i><h3>Your cart is empty</h3><p>Add some products before checking out.</p><a href="category.html" class="btn btn-primary">Start Shopping</a></div>`;
} else {
  const user = getCurrentUser();
  const subtotal = cartTotal();
  const shipping = subtotal >= 999 ? 0 : 79;
  const tax = Math.round(subtotal * 0.05);
  const total = subtotal + shipping + tax;

  body.innerHTML = `
  <form id="checkoutForm" class="checkout-layout">
    <div>
      <div class="checkout-card">
        <h3><span class="num">1</span> Shipping Details</h3>
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input required name="fullName" value="${user ? user.name : ""}"></div>
          <div class="form-group"><label>Phone Number</label><input required name="phone" pattern="[0-9]{10}" value="${user ? user.phone : ""}" placeholder="10-digit mobile number"></div>
        </div>
        <div class="form-group"><label>Address</label><textarea required name="address" rows="2" placeholder="House no, street, area">${user ? user.address : ""}</textarea></div>
        <div class="form-row">
          <div class="form-group"><label>City</label><input required name="city" placeholder="e.g. Ahmedabad"></div>
          <div class="form-group"><label>State</label><input required name="state" placeholder="e.g. Gujarat"></div>
        </div>
        <div class="form-group" style="max-width:200px;"><label>PIN Code</label><input required name="pincode" pattern="[0-9]{6}" placeholder="6-digit PIN"></div>
      </div>

      <div class="checkout-card">
        <h3><span class="num">2</span> Payment Method</h3>
        <div class="pay-methods" id="payMethods">
          <label class="active"><input type="radio" name="method" value="card" checked> <i class="fa-regular fa-credit-card"></i> Debit / Credit Card</label>
          <label><input type="radio" name="method" value="upi"> <i class="fa-solid fa-mobile-screen"></i> UPI</label>
          <label><input type="radio" name="method" value="cod"> <i class="fa-solid fa-money-bill-wave"></i> Cash on Delivery</label>
        </div>

        <div id="cardFields">
          <div class="form-group"><label>Card Number</label><input name="cardNumber" maxlength="19" placeholder="1234 5678 9012 3456"></div>
          <div class="form-row">
            <div class="form-group"><label>Name on Card</label><input name="cardName" placeholder="As printed on card"></div>
            <div class="form-group"><label>Expiry</label><input name="cardExpiry" maxlength="5" placeholder="MM/YY"></div>
          </div>
          <div class="form-group" style="max-width:140px;"><label>CVV</label><input name="cardCvv" maxlength="3" placeholder="123"></div>
        </div>
        <div id="upiFields" style="display:none;">
          <div class="form-group"><label>UPI ID</label><input name="upiId" placeholder="yourname@upi"></div>
        </div>
        <div id="codFields" style="display:none;">
          <p style="font-size:13.5px;color:var(--muted);">Pay in cash when your order is delivered. A small COD handling fee may apply.</p>
        </div>
        <p class="demo-note"><i class="fa-solid fa-circle-info"></i> This is a demo payment form — no real transaction is processed. Do not enter real card details.</p>
      </div>
    </div>

    <div>
      <div class="checkout-card order-summary-mini">
        <h3 style="margin-bottom:14px;">Order Summary</h3>
        ${items.map(i => `
          <div class="row">
            <div class="left"><img src="${i.product.image}" alt="${i.product.name}"><span>${i.product.name} × ${i.qty}</span></div>
            <span>${formatINR(i.product.price * i.qty)}</span>
          </div>`).join("")}
        <div class="summary-row"><span>Subtotal</span><span>${formatINR(subtotal)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? "FREE" : formatINR(shipping)}</span></div>
        <div class="summary-row"><span>Tax (5%)</span><span>${formatINR(tax)}</span></div>
        <div class="summary-row total"><span>Total Payable</span><span>${formatINR(total)}</span></div>
        <button type="submit" class="btn btn-primary btn-block mt-24"><i class="fa-solid fa-lock"></i> Place Order</button>
      </div>
    </div>
  </form>`;

  document.querySelectorAll('input[name="method"]').forEach(r => r.addEventListener("change", e => {
    document.querySelectorAll("#payMethods label").forEach(l => l.classList.remove("active"));
    e.target.closest("label").classList.add("active");
    document.getElementById("cardFields").style.display = e.target.value === "card" ? "block" : "none";
    document.getElementById("upiFields").style.display = e.target.value === "upi" ? "block" : "none";
    document.getElementById("codFields").style.display = e.target.value === "cod" ? "block" : "none";
  }));

  document.getElementById("checkoutForm").addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const method = fd.get("method");
    let last4 = null;
    if (method === "card") {
      const num = (fd.get("cardNumber") || "").replace(/\s/g,"");
      last4 = num.slice(-4);
    }
    const order = placeOrder({
      shipping: {
        fullName: fd.get("fullName"), phone: fd.get("phone"), address: fd.get("address"),
        city: fd.get("city"), state: fd.get("state"), pincode: fd.get("pincode")
      },
      payment: { method, last4 }
    });
    window.location.href = "order-success.html?id=" + order.id;
  });
}
</script>
</body>
</html>
