<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ShopKart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Shop<span class="dot">Kart</span></a>
  </div>
</header>

<div class="container">
  <div class="auth-wrap">
    <h2>Welcome back</h2>
    <p class="sub">Login to your ShopKart account</p>
    <div class="demo-note"><i class="fa-solid fa-circle-info"></i> Admin demo login — Username: <strong>admin</strong>, Password: <strong>admin123</strong></div>
    <div class="form-error" id="formError"></div>
    <form id="loginForm">
      <div class="form-group"><label>Username</label><input required name="username" placeholder="Enter your username"></div>
      <div class="form-group"><label>Password</label><input required type="password" name="password" placeholder="Enter your password"></div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="form-note">New to ShopKart? <a href="register.html" style="color:var(--teal);font-weight:600;">Create an account</a></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = loginUser(fd.get("username").trim(), fd.get("password"));
  const err = document.getElementById("formError");
  if (!res.ok) {
    err.textContent = res.error;
    err.style.display = "block";
    return;
  }
  window.location.href = res.user.role === "admin" ? "admin.html" : "index.html";
});
</script>
</body>
</html>
