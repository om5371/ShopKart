<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — ShopKart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Shop<span class="dot">Kart</span></a>
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Search for products, brands and more">
      <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>
    <div class="header-actions">
      <a id="accountLink" href="login.html"><i class="fa-solid fa-user"></i><span id="accountLabel">Login</span></a>
      <a href="cart.html" style="position:relative;">
        <i class="fa-solid fa-cart-shopping"></i><span>Cart</span>
        <span class="cart-badge" style="display:none;">0</span>
      </a>
    </div>
  </div>
</header>
<nav class="category-nav"><div class="container" id="categoryNav"></div></nav>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
</div>

<div class="container section" style="padding-top:8px;">
  <div class="pd-layout" id="pdLayout"></div>
</div>

<div class="container section" style="border-top:1px solid var(--line);">
  <div class="section-head"><h2 style="font-size:22px;">You may also like</h2></div>
  <div class="product-grid" id="relatedGrid"></div>
</div>

<footer style="margin-top:20px;">
  <div class="footer-bottom">© 2026 ShopKart. All prices are shown in Indian Rupees (₹). Demo project for educational purposes.</div>
</footer>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById("categoryNav").innerHTML = CATEGORIES.map(c => `<a href="category.html?cat=${c.id}">${c.name}</a>`).join("");

const params = new URLSearchParams(window.location.search);
const product = getProductById(params.get("id"));

if (!product) {
  document.getElementById("pdLayout").innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><h3>Product not found</h3><p>The product you're looking for doesn't exist.</p><a href="category.html" class="btn btn-dark">Browse Products</a></div>`;
} else {
  document.title = product.name + " — ShopKart";
  const cat = getCategory(product.category);
  document.getElementById("breadcrumb").innerHTML =
    `<a href="index.html">Home</a> / <a href="category.html?cat=${cat.id}">${cat.name}</a> / <span>${product.name}</span>`;

  const stockLabel = product.stock > 10
    ? `<span class="pd-stock in"><i class="fa-solid fa-circle-check"></i> In Stock</span>`
    : product.stock > 0
      ? `<span class="pd-stock low"><i class="fa-solid fa-triangle-exclamation"></i> Only ${product.stock} left</span>`
      : `<span class="pd-stock" style="color:var(--danger);"><i class="fa-solid fa-xmark"></i> Out of Stock</span>`;

  const discount = product.oldPrice ? Math.round(100 - (product.price/product.oldPrice)*100) : 0;

  document.getElementById("pdLayout").innerHTML = `
    <div>
      <div class="pd-gallery-main"><img id="mainImg" src="${product.image}" alt="${product.name}"></div>
      <div class="pd-thumbs" id="pdThumbs">
        ${product.images.map((im,i) => `<img src="${im}" class="${i===0?'active':''}" onclick="setMain(this,'${im}')">`).join("")}
      </div>
    </div>
    <div>
      <span class="product-cat">${product.subcategory}</span>
      <h1 class="pd-title">${product.name}</h1>
      <div class="pd-meta">
        <span class="product-rating">${starHtml(product.rating)} (${product.rating})</span>
        <span>|</span>
        <span>SKU: ${product.id.toUpperCase()}</span>
      </div>
      <div class="pd-price">
        <span class="price-now">${formatINR(product.price)}</span>
        ${product.oldPrice ? `<span class="price-old">${formatINR(product.oldPrice)}</span><span class="badge pending">${discount}% OFF</span>` : ""}
      </div>
      ${stockLabel}
      <p class="pd-desc">${product.description}</p>
      <div>
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:8px;">Quantity</label>
        <div class="qty-selector">
          <button onclick="changeQty(-1)">−</button>
          <input type="number" id="qtyInput" value="1" min="1" max="${product.stock}">
          <button onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div class="pd-actions">
        <button class="btn btn-primary" ${product.stock===0?"disabled":""} onclick="addAndGo()"><i class="fa-solid fa-bolt"></i> Buy Now</button>
        <button class="btn btn-dark" ${product.stock===0?"disabled":""} onclick="addOnly()"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
      </div>
      <ul class="pd-features">
        <li><i class="fa-solid fa-truck"></i> Free delivery on orders above ₹999</li>
        <li><i class="fa-solid fa-rotate-left"></i> 7-day easy return &amp; exchange</li>
        <li><i class="fa-solid fa-shield-halved"></i> 100% secure payments</li>
        <li><i class="fa-solid fa-tag"></i> Genuine product guarantee</li>
      </ul>
    </div>`;

  const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0,4);
  document.getElementById("relatedGrid").innerHTML = related.map(productCardHtml).join("");
}

function setMain(el, src) {
  document.getElementById("mainImg").src = src;
  document.querySelectorAll("#pdThumbs img").forEach(i => i.classList.remove("active"));
  el.classList.add("active");
}
function changeQty(delta) {
  const input = document.getElementById("qtyInput");
  let v = parseInt(input.value) + delta;
  if (v < 1) v = 1;
  if (v > product.stock) v = product.stock;
  input.value = v;
}
function addOnly() {
  const qty = parseInt(document.getElementById("qtyInput").value) || 1;
  addToCart(product.id, qty);
  showToast("Added to cart", "fa-cart-plus");
}
function addAndGo() {
  const qty = parseInt(document.getElementById("qtyInput").value) || 1;
  addToCart(product.id, qty);
  window.location.href = "cart.html";
}
</script>
</body>
</html>
