<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — ShopKart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Shop<span class="dot">Kart</span></a>
  </div>
</header>

<div class="container">
  <div class="auth-wrap" style="max-width:520px;">
    <h2>Create your account</h2>
    <p class="sub">Join ShopKart to track orders and checkout faster</p>
    <div class="form-error" id="formError"></div>
    <form id="registerForm">
      <div class="form-row">
        <div class="form-group"><label>Full Name</label><input required name="name" placeholder="Your full name"></div>
        <div class="form-group"><label>Username</label><input required name="username" placeholder="Choose a username"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input required type="email" name="email" placeholder="you@example.com"></div>
        <div class="form-group"><label>Phone Number</label><input required name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number"></div>
      </div>
      <div class="form-group"><label>Address</label><textarea required name="address" rows="2" placeholder="House no, street, city, state"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Password</label><input required type="password" name="password" placeholder="Create a password"></div>
        <div class="form-group"><label>Confirm Password</label><input required type="password" name="confirm" placeholder="Re-enter password"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="form-note">Already have an account? <a href="login.html" style="color:var(--teal);font-weight:600;">Login</a></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const err = document.getElementById("formError");
  if (fd.get("password") !== fd.get("confirm")) {
    err.textContent = "Passwords do not match.";
    err.style.display = "block";
    return;
  }
  if (fd.get("password").length < 6) {
    err.textContent = "Password must be at least 6 characters.";
    err.style.display = "block";
    return;
  }
  const res = registerUser({
    username: fd.get("username").trim(),
    password: fd.get("password"),
    name: fd.get("name").trim(),
    email: fd.get("email").trim(),
    phone: fd.get("phone").trim(),
    address: fd.get("address").trim()
  });
  if (!res.ok) {
    err.textContent = res.error;
    err.style.display = "block";
    return;
  }
  loginUser(fd.get("username").trim(), fd.get("password"));
  window.location.href = "index.html";
});
</script>
</body>
</html>
